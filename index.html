<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>G-Matrix Live</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#071421;
color:white;
overflow:hidden;
}

.hidden{
display:none!important;
}

.top{
height:70px;
background:linear-gradient(45deg,#00d2b7,#ff2ea6);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
}

.home{
padding:20px;
}

.card{
background:#10263d;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
background:#18324d;
border-radius:14px;
margin-top:15px;
color:white;
font-size:16px;
}

button{
border:none;
padding:15px;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.hostBtn{
width:100%;
background:#00d2b7;
margin-top:15px;
color:white;
}

.joinBtn{
width:100%;
background:#ff2ea6;
margin-top:15px;
color:white;
}

.room{
height:100vh;
display:flex;
flex-direction:column;
}

.roomTop{
height:70px;
background:#081524;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

.mics{
flex:1;
overflow:auto;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.seat{
background:#10263d;
height:170px;
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
position:relative;
}

.avatar{
width:75px;
height:75px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:bold;
position:relative;
}

.speaking{
animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
box-shadow:0 0 0 0 rgba(0,255,170,.7);
}

70%{
box-shadow:0 0 0 20px rgba(0,255,170,0);
}

100%{
box-shadow:0 0 0 0 rgba(0,255,170,0);
}

}

.name{
margin-top:10px;
font-size:15px;
}

.micActions{
margin-top:10px;
display:flex;
gap:10px;
}

.smallBtn{
padding:8px 10px;
font-size:13px;
border-radius:10px;
}

.red{
background:red;
color:white;
}

.green{
background:#00d2b7;
color:white;
}

.chat{
height:230px;
background:#081524;
padding:10px;
}

.messages{
height:150px;
overflow:auto;
margin-bottom:10px;
}

.msg{
background:#10263d;
padding:10px;
border-radius:10px;
margin-bottom:8px;
}

.chatRow{
display:flex;
gap:10px;
}

.chatRow input{
margin-top:0;
flex:1;
}

.send{
background:#00d2b7;
color:white;
width:60px;
}

.popup{
position:fixed;
inset:0;
background:#000b;
display:flex;
align-items:center;
justify-content:center;
z-index:100;
}

.popupCard{
width:90%;
background:#10263d;
padding:25px;
border-radius:20px;
text-align:center;
}

.popupCard button{
width:100%;
margin-top:15px;
}

</style>
</head>

<body>

<div id="homePage">

<div class="top">
G-Matrix
</div>

<div class="home">

<div class="card">

<h2>Your Name</h2>

<input id="name"
placeholder="Enter name">

<button class="hostBtn"
onclick="hostRoom()">

<i class="fa fa-microphone"></i>
Host Room

</button>

</div>

<div class="card">

<h2>Join Room</h2>

<input id="roomId"
placeholder="Enter Room ID">

<button class="joinBtn"
onclick="joinRoom()">

<i class="fa fa-headphones"></i>
Join Room

</button>

</div>

</div>

</div>

<div class="room hidden"
id="roomPage">

<div class="roomTop">

<div>
<h2 id="roomTitle">
Room
</h2>
</div>

<button class="red"
onclick="leaveRoom()">

Leave

</button>

</div>

<div class="mics"
id="mics"></div>

<div class="chat">

<div class="messages"
id="messages"></div>

<div class="chatRow">

<input id="msgInput"
placeholder="Message">

<button class="send"
onclick="sendMsg()">

<i class="fa fa-paper-plane"></i>

</button>

</div>

</div>

</div>

<div class="popup hidden"
id="joinPopup">

<div class="popupCard">

<h2>Join Options</h2>

<button class="green"
onclick="listenHost()">

Listen To Host

</button>

<button class="hostBtn"
onclick="applyMic()">

Apply Mic

</button>

</div>

</div>

<script>

const socket = io();

const APP_ID =
"08f3860e6a9f4775b0b5acefe96b2b51";

let client;
let localTrack;

let roomId = "";
let myName = "";

let isHost = false;

let micApproved = false;

const uid =
String(Math.floor(Math.random()*999999));

function randomColor(){

const colors = [
"#00d2b7",
"#ff2ea6",
"#6a00ff",
"#ff8800",
"#0099ff"
];

return colors[
Math.floor(
Math.random()*colors.length
)
];

}

function createSeat(user){

const div =
document.createElement("div");

div.className = "seat";

div.id = "seat-"+user.uid;

div.innerHTML = `

<div class="avatar"
id="avatar-${user.uid}"

style="
background:${randomColor()}
">

${user.name
.charAt(0)
.toUpperCase()}

</div>

<div class="name">
${user.name}
</div>

${isHost && !user.host ? `

<div class="micActions">

<button
class="smallBtn red"

onclick="
muteUser(
'${user.uid}'
)
">

Mute

</button>

<button
class="smallBtn green"

onclick="
unmuteUser(
'${user.uid}'
)
">

Unmute

</button>

</div>

`:''}

`;

document
.getElementById("mics")
.appendChild(div);

}

async function startAgora(){

client =
AgoraRTC.createClient({
mode:"rtc",
codec:"vp8"
});

await client.join(
APP_ID,
roomId,
null,
uid
);

client.enableAudioVolumeIndicator();

client.on(
"volume-indicator",
volumes=>{

volumes.forEach(v=>{

const avatar =
document.getElementById(
"avatar-"+v.uid
);

if(!avatar) return;

if(v.level > 5){

avatar.classList
.add("speaking");

}else{

avatar.classList
.remove("speaking");

}

});

});

client.on(
"user-published",

async(user,mediaType)=>{

await client.subscribe(
user,
mediaType
);

if(mediaType==="audio"){

user.audioTrack.play();

}

});

if(isHost || micApproved){

localTrack =
await AgoraRTC
.createMicrophoneAudioTrack();

await client.publish([
localTrack
]);

}

}

function hostRoom(){

myName =
document.getElementById("name")
.value;

if(!myName)
return alert("Enter name");

isHost = true;

roomId =
Math.floor(
100000+
Math.random()*900000
).toString();

startRoom();

socket.emit("host-room",{

roomId,
name:myName,
uid

});

}

function joinRoom(){

myName =
document.getElementById("name")
.value;

roomId =
document.getElementById("roomId")
.value;

if(!myName || !roomId){

return alert("Fill all");

}

document
.getElementById("joinPopup")
.classList
.remove("hidden");

}

function listenHost(){

document
.getElementById("joinPopup")
.classList
.add("hidden");

startRoom();

socket.emit("join-room",{

roomId,
name:myName,
uid

});

}

function applyMic(){

micApproved = true;

document
.getElementById("joinPopup")
.classList
.add("hidden");

startRoom();

socket.emit("join-room",{

roomId,
name:myName,
uid

});

socket.emit("apply-mic",{

roomId,
name:myName

});

}

async function startRoom(){

document
.getElementById("homePage")
.classList
.add("hidden");

document
.getElementById("roomPage")
.classList
.remove("hidden");

document
.getElementById("roomTitle")
.innerHTML =
"Room ID : "+roomId;

await startAgora();

createSeat({
name:myName,
uid,
host:isHost
});

}

socket.on(
"room-users",
users=>{

document
.getElementById("mics")
.innerHTML="";

users.forEach(user=>{

if(user.mic){

createSeat(user);

}

});

});

socket.on(
"mic-request",
data=>{

if(confirm(
data.name+
" wants microphone"
)){

socket.emit(
"accept-mic",
{
roomId,
userSocket:data.socketId
}
);

}

});

socket.on(
"mic-approved",
async()=>{

if(!localTrack){

localTrack =
await AgoraRTC
.createMicrophoneAudioTrack();

await client.publish([
localTrack
]);

}

alert("Mic Approved");

});

socket.on(
"force-muted",
()=>{

if(localTrack){

localTrack.setEnabled(false);

}

alert("Host muted you");

});

socket.on(
"host-unmuted",
()=>{

if(localTrack){

localTrack.setEnabled(true);

}

});

function muteUser(uidd){

socket.emit("mute-user",{
roomId,
userSocket:uidd
});

}

function unmuteUser(uidd){

socket.emit("unmute-user",{
roomId,
userSocket:uidd
});

}

function sendMsg(){

const input =
document
.getElementById("msgInput");

if(!input.value) return;

socket.emit(
"send-message",
{
roomId,
name:myName,
message:input.value
}
);

input.value="";

}

socket.on(
"receive-message",
data=>{

const div =
document.createElement("div");

div.className = "msg";

div.innerHTML =
"<b>"+data.name+
"</b><br>"+
data.message;

document
.getElementById("messages")
.appendChild(div);

});

socket.on(
"room-ended",
()=>{

alert("Host ended live");

location.reload();

});

async function leaveRoom(){

if(localTrack){

localTrack.close();

}

if(client){

await client.leave();

}

location.reload();

}

</script>

</body>
</html>
