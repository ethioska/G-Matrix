<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Matrix</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#02101f;
color:white;
overflow:hidden;
}

.header{
height:80px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(90deg,#18d5cf,#ff2ea6);
font-size:40px;
font-weight:bold;
}

.container{
padding:15px;
height:calc(100vh - 80px);
overflow:auto;
}

.card{
background:#10263f;
padding:20px;
border-radius:25px;
margin-bottom:20px;
}

.input{
width:100%;
height:60px;
border:none;
outline:none;
background:#1d3652;
border-radius:18px;
padding:0 20px;
color:white;
font-size:18px;
margin-top:15px;
}

.btn{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:22px;
font-weight:bold;
color:white;
margin-top:15px;
}

.host-btn{
background:#17d3c1;
}

.join-btn{
background:#ff2ea6;
}

.room{
display:none;
height:100vh;
}

.topbar{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:20px;
}

.live-count{
background:#1d3652;
padding:10px 20px;
border-radius:15px;
}

.leave-btn{
background:red;
padding:12px 20px;
border:none;
border-radius:15px;
color:white;
font-size:18px;
}

.seats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.seat{
background:#10263f;
border-radius:25px;
padding:20px;
text-align:center;
position:relative;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
margin:auto;
background:linear-gradient(45deg,#ff2ea6,#ff9800);
}

.speaking{
animation:pulse 1s infinite;
box-shadow:0 0 20px #17d3c1;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

.controls{
display:flex;
gap:10px;
justify-content:center;
margin-top:10px;
}

.small-btn{
padding:8px 14px;
border:none;
border-radius:10px;
color:white;
}

.mute{
background:#ff9800;
}

.kick{
background:red;
}

.requests{
background:#10263f;
padding:15px;
margin:15px;
border-radius:20px;
}

.request-user{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
background:#1d3652;
padding:10px;
border-radius:12px;
}

.chat-box{
position:fixed;
bottom:0;
left:0;
right:0;
padding:10px;
display:flex;
gap:10px;
background:#02101f;
}

.chat-input{
flex:1;
height:55px;
border:none;
outline:none;
border-radius:16px;
padding:0 15px;
background:#1d3652;
color:white;
}

.send-btn{
width:60px;
height:55px;
border:none;
border-radius:16px;
background:#17d3c1;
color:white;
font-size:20px;
}

.messages{
height:200px;
overflow:auto;
padding:15px;
}

.message{
background:#10263f;
padding:10px;
border-radius:14px;
margin-bottom:10px;
}

@media(max-width:700px){
.seats{
grid-template-columns:1fr;
}
}

</style>
</head>
<body>

<div id="home">

<div class="header">G-Matrix</div>

<div class="container">

<div class="card">
<h2>Host Room</h2>
<input id="hostName" class="input" placeholder="Your Name">
<button type="button" id="hostBtn" class="btn host-btn">🎤 Host Live</button>
</div>

<div class="card">
<h2>Join Room</h2>
<input id="joinName" class="input" placeholder="Your Name">
<input id="joinHost" class="input" placeholder="Host Name">
<input id="joinRoom" class="input" placeholder="Room ID">
<button type="button" id="joinBtn" class="btn join-btn">🎧 Join Live</button>
</div>

</div>

</div>

<div id="roomPage" class="room">

<div class="topbar">
<div>
<h2 id="roomTitle"></h2>
<div id="listenerCount" class="live-count">0 Listeners</div>
</div>
<button id="leaveBtn" class="leave-btn">Leave</button>
</div>

<div id="requests" class="requests" style="display:none;">
<h3>Mic Requests</h3>
<div id="requestList"></div>
</div>

<div id="seats" class="seats"></div>

<div id="messages" class="messages"></div>

<div class="chat-box">
<input id="chatInput" class="chat-input" placeholder="Message">
<button id="sendBtn" class="send-btn">
<i class="fa-solid fa-paper-plane"></i>
</button>
</div>

</div>

<script>

const APP_ID = '08f3860e6a9f4775b0b5acefe96b2b51';

const socket = io();

let rtcClient;
let localTrack;
let currentRoom;
let isHost = false;
let myName = '';

const home = document.getElementById('home');
const roomPage = document.getElementById('roomPage');
const seats = document.getElementById('seats');
const requestList = document.getElementById('requestList');
const requestsBox = document.getElementById('requests');
const listenerCount = document.getElementById('listenerCount');
const roomTitle = document.getElementById('roomTitle');
const messages = document.getElementById('messages');

function randomColor(){
const colors=[
'#ff9800','#17d3c1','#ff2ea6','#7c4dff','#00bcd4'
];
return colors[Math.floor(Math.random()*colors.length)];
}

function createSeat(user,isSpeaker=false){

const div=document.createElement('div');
div.className='seat';

const first=user.name.charAt(0).toUpperCase();

let controls='';

if(isHost && isSpeaker){
controls=`
<div class="controls">
<button class="small-btn mute" onclick="muteUser('${user.id}')">Mute</button>
<button class="small-btn kick" onclick="kickUser('${user.id}')">Kick</button>
</div>
`;
}

div.innerHTML=`
<div class="avatar" style="background:${randomColor()}">${first}</div>
<h3>${user.name}</h3>
${controls}
`;

seats.appendChild(div);
}

function renderRoom(room){

seats.innerHTML='';

listenerCount.innerHTML=`${room.listeners.length} Listeners`;

createSeat({
name:room.hostName,
id:room.hostSocket
},false);

room.speakers.forEach(user=>{
createSeat(user,true);
});

if(isHost){
requestsBox.style.display='block';
requestList.innerHTML='';

room.requests.forEach(user=>{

const div=document.createElement('div');
div.className='request-user';

div.innerHTML=`
<span>${user.name}</span>
<div>
<button onclick="approve('${user.id}')">Approve</button>
<button onclick="reject('${user.id}')">Reject</button>
</div>
`;

requestList.appendChild(div);

});
}

}

async function startAgora(channel,mic=true){

rtcClient=AgoraRTC.createClient({mode:'rtc',codec:'vp8'});

await rtcClient.join(APP_ID,channel,null,null);

if(mic){
localTrack=await AgoraRTC.createMicrophoneAudioTrack();
await rtcClient.publish([localTrack]);
}

rtcClient.on('user-published',async(user,mediaType)=>{

await rtcClient.subscribe(user,mediaType);

if(mediaType==='audio'){
user.audioTrack.play();
}

});

}

document.getElementById('hostBtn').onclick=async()=>{

const name=document.getElementById('hostName').value.trim();

if(!name)return alert('Enter name');

myName=name;
isHost=true;

socket.emit('host-room',{hostName:name});

}

document.getElementById('joinBtn').onclick=()=>{

const userName=document.getElementById('joinName').value.trim();
const hostName=document.getElementById('joinHost').value.trim();
const roomId=document.getElementById('joinRoom').value.trim();

if(!userName||!hostName||!roomId){
alert('Fill all');
return;
}

myName=userName;

socket.emit('join-room',{
userName,
hostName,
roomId
});

}

socket.on('room-created',async room=>{

currentRoom=room.roomId;

home.style.display='none';
roomPage.style.display='block';

roomTitle.innerHTML='Room ID : '+room.roomId;

renderRoom(room);

await startAgora(room.roomId,true);

});

socket.on('joined-success',async room=>{

currentRoom=room.roomId;

home.style.display='none';
roomPage.style.display='block';

roomTitle.innerHTML='Room ID : '+room.roomId;

renderRoom(room);

await startAgora(room.roomId,false);

});

socket.on('room-update',room=>{
renderRoom(room);
});

socket.on('room-error',msg=>{
alert(msg);
});

socket.on('mic-request',data=>{
if(isHost){
alert(data.name+' requested mic');
}
});

socket.on('approved-speaker',async()=>{

alert('Mic approved');

if(!localTrack){
localTrack=await AgoraRTC.createMicrophoneAudioTrack();
await rtcClient.publish([localTrack]);
}

});

socket.on('request-rejected',()=>{
alert('Mic rejected');
});

socket.on('host-ended',()=>{
alert('Host ended live');
location.reload();
});

socket.on('kicked',()=>{
alert('Removed by host');
location.reload();
});

socket.on('muted-by-host',()=>{
if(localTrack)localTrack.setEnabled(false);
alert('Muted by host');
});

socket.on('unmuted-by-host',()=>{
if(localTrack)localTrack.setEnabled(true);
});

function approve(id){
socket.emit('approve-user',id);
}

function reject(id){
socket.emit('reject-user',id);
}

function muteUser(id){
socket.emit('mute-user',id);
}

function kickUser(id){
socket.emit('kick-user',id);
}

const sendBtn=document.getElementById('sendBtn');

sendBtn.onclick=()=>{

const input=document.getElementById('chatInput');

if(!input.value.trim())return;

socket.emit('chat-message',{
text:input.value
});

input.value='';

}

socket.on('new-chat',msg=>{

const div=document.createElement('div');
div.className='message';

div.innerHTML=`<b>${msg.name}</b><br>${msg.text}`;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

});

document.getElementById('leaveBtn').onclick=()=>{
location.reload();
}

</script>

</body>
</html>
