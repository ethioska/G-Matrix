<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>G-Matrix Live</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#021428;
color:white;
}

.top{
padding:20px;
background:linear-gradient(90deg,#11d9c5,#ff2da5);
font-size:40px;
font-weight:bold;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:#0d2744;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:#183554;
color:white;
font-size:18px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
color:white;
cursor:pointer;
}

.hostBtn{
background:#12d4c2;
}

.joinBtn{
background:#ff2da5;
}

.live{
display:none;
}

.roomTop{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
}

.counter{
display:flex;
gap:15px;
font-size:18px;
}

.hostCard{
background:#0d2744;
margin:20px;
padding:25px;
border-radius:20px;
text-align:center;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
background:#ff9800;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
margin:auto;
}

.speakers{
padding:15px;
}

.speaker{
background:#0d2744;
padding:20px;
border-radius:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.controls{
display:flex;
gap:10px;
}

.smallBtn{
padding:10px 15px;
border:none;
border-radius:10px;
font-size:15px;
cursor:pointer;
}

.mute{
background:orange;
}

.kick{
background:red;
}

.chat{
position:fixed;
bottom:0;
width:100%;
display:flex;
padding:10px;
background:#021428;
box-sizing:border-box;
}

.chat input{
margin:0;
}

.send{
width:80px;
margin-left:10px;
background:#12d4c2;
}

.requestBox{
position:fixed;
top:20px;
right:20px;
background:#ff2da5;
padding:15px;
border-radius:15px;
display:none;
z-index:999;
}

</style>

</head>

<body>

<div class="top">
G-Matrix
</div>

<div class="container" id="home">

<div class="card">

<h1>Your Name</h1>

<input id="hostName" placeholder="Enter name"/>

<button class="hostBtn" onclick="hostRoom()">
<i class="fa fa-microphone"></i>
Host Room
</button>

</div>

<div class="card">

<h1>Join Room</h1>

<input id="joinName" placeholder="Your name"/>
<input id="joinHost" placeholder="Host name"/>
<input id="roomId" placeholder="Room ID"/>

<button class="joinBtn" onclick="joinRoom()">
<i class="fa fa-headphones"></i>
Join Room
</button>

</div>

</div>

<!-- LIVE -->

<div class="live" id="livePage">

<div class="roomTop">

<h2 id="roomText"></h2>

<div class="counter">
<div>👥 <span id="listenerCount">0</span></div>
<div>🎤 <span id="speakerCount">0</span></div>
</div>

</div>

<div class="hostCard">

<div class="avatar" id="hostAvatar">H</div>

<h2 id="hostLabel"></h2>

</div>

<div class="speakers" id="speakers"></div>

</div>

<div class="chat">

<input id="msg" placeholder="Message"/>

<button class="send" onclick="sendMessage()">
<i class="fa fa-paper-plane"></i>
</button>

</div>

<div class="requestBox" id="requestBox"></div>

<script>

const socket = io();

let currentRoom = "";
let myName = "";
let isHost = false;

// =======================
// HOST ROOM
// =======================

function hostRoom(){

const name = document.getElementById("hostName").value;

if(!name) return alert("Enter name");

myName = name;
isHost = true;

socket.emit("host-room",{name});

}

socket.on("room-created", data => {

currentRoom = data.roomId;

document.getElementById("home").style.display="none";
document.getElementById("livePage").style.display="block";

document.getElementById("roomText").innerHTML =
"Room ID : " + data.roomId;

document.getElementById("hostLabel").innerHTML =
data.hostName;

document.getElementById("hostAvatar").innerHTML =
data.hostName.charAt(0).toUpperCase();

});

// =======================
// JOIN ROOM
// =======================

function joinRoom(){

const name =
document.getElementById("joinName").value;

const hostName =
document.getElementById("joinHost").value;

const roomId =
document.getElementById("roomId").value;

if(!name || !hostName || !roomId){
alert("Fill all");
return;
}

myName = name;

socket.emit("join-room",{
name,
hostName,
roomId
});

}

socket.on("join-success", data => {

currentRoom = data.roomId;

document.getElementById("home").style.display="none";
document.getElementById("livePage").style.display="block";

document.getElementById("roomText").innerHTML =
"Room ID : " + data.roomId;

document.getElementById("hostLabel").innerHTML =
data.hostName;

document.getElementById("hostAvatar").innerHTML =
data.hostName.charAt(0).toUpperCase();

setTimeout(()=>{

if(confirm("Apply Mic?")){

socket.emit("apply-mic",{
roomId:currentRoom,
name:myName
});

}

},1000);

});

socket.on("join-error", msg => {
alert(msg);
});

// =======================
// MIC REQUEST
// =======================

socket.on("mic-request", data => {

if(!isHost) return;

const approve = confirm(
data.name + " wants mic"
);

if(approve){

socket.emit("accept-mic",{
roomId:currentRoom,
userSocket:data.socketId,
name:data.name
});

}else{

socket.emit("reject-mic",{
userSocket:data.socketId
});

}

});

// =======================
// SPEAKERS
// =======================

socket.on("speaker-update", data => {

document.getElementById("speakerCount").innerHTML =
data.speakers.length;

const speakers =
document.getElementById("speakers");

speakers.innerHTML = "";

data.speakers.forEach(user=>{

speakers.innerHTML += `

<div class="speaker">

<div>
<h3>${user.name}</h3>
</div>

<div class="controls">

<button class="smallBtn mute">
Mute
</button>

<button class="smallBtn kick">
Kick
</button>

</div>

</div>

`;

});

});

// =======================
// LISTENERS
// =======================

socket.on("listener-update", data => {

document.getElementById("listenerCount").innerHTML =
data.total;

});

// =======================
// CHAT
// =======================

function sendMessage(){

const msg =
document.getElementById("msg").value;

socket.emit("send-message",{
roomId:currentRoom,
name:myName,
message:msg
});

document.getElementById("msg").value="";

}

socket.on("new-message", data => {

alert(data.name + ": " + data.message);

});

// =======================
// ROOM CLOSED
// =======================

socket.on("room-closed", ()=>{

alert("Host ended live");

location.reload();

});

</script>

</body>
</html>
