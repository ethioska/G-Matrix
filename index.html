<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>G-Matrix</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0d0d14;
color:white;
overflow:hidden;
height:100vh;
}

.app{
display:flex;
flex-direction:column;
height:100vh;
}

/* TOP BAR */

.top-bar{
height:60px;
background:linear-gradient(90deg,#00c6a2,#ff4da6);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-weight:bold;
}

.wallet{
display:flex;
gap:12px;
font-size:14px;
}

.wallet span{
background:rgba(255,255,255,0.2);
padding:6px 10px;
border-radius:20px;
}

/* PAGES */

.page{
display:none;
flex:1;
overflow-y:auto;
padding-bottom:80px;
}

.page.active{
display:block;
}

/* HOME */

.live-card{
background:#181824;
margin:12px;
border-radius:20px;
padding:15px;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.live-header{
display:flex;
justify-content:space-between;
align-items:center;
}

.live-title{
font-size:18px;
font-weight:bold;
}

.live-users{
font-size:13px;
opacity:0.8;
}

/* LIVE ROOM */

.live-room{
padding:15px;
}

.host-seat{
display:flex;
justify-content:center;
margin-bottom:25px;
}

.host-circle{
width:110px;
height:110px;
border-radius:50%;
background:linear-gradient(135deg,#00d9a5,#ff4da6);
display:flex;
align-items:center;
justify-content:center;
position:relative;
animation:pulse 2s infinite;
}

.host-circle img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}

.voice-ring{
position:absolute;
width:130px;
height:130px;
border:4px solid #00ffae;
border-radius:50%;
animation:voicePulse 1s infinite;
}

@keyframes voicePulse{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(1.4);opacity:0;}
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

.mic-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.mic-seat{
background:#1f1f2d;
border-radius:20px;
padding:12px;
text-align:center;
position:relative;
}

.mic-seat .seat-number{
font-size:13px;
opacity:0.7;
}

.mic-seat i{
font-size:25px;
margin-top:10px;
color:#ff4da6;
}

/* AUDIENCE */

.audience{
margin-top:25px;
background:#161622;
padding:15px;
border-radius:20px;
max-height:150px;
overflow-y:auto;
}

.audience-user{
padding:8px;
border-bottom:1px solid rgba(255,255,255,0.08);
}

/* CHAT */

.chat-container{
padding:15px;
}

.chat-box{
background:#181824;
padding:10px;
border-radius:20px;
height:60vh;
overflow-y:auto;
}

.message{
margin:10px 0;
display:flex;
flex-direction:column;
}

.message.sent{
align-items:flex-end;
}

.bubble{
padding:10px 15px;
border-radius:20px;
max-width:75%;
}

.sent .bubble{
background:linear-gradient(90deg,#00c6a2,#ff4da6);
}

.received .bubble{
background:#242438;
}

.chat-input{
display:flex;
margin-top:15px;
gap:10px;
}

.chat-input input{
flex:1;
padding:12px;
border:none;
border-radius:30px;
background:#1f1f2d;
color:white;
}

.chat-input button{
border:none;
background:#ff4da6;
color:white;
width:50px;
border-radius:50%;
font-size:18px;
}

/* HOLD RECORD */

.record-btn{
margin-top:15px;
width:100%;
padding:15px;
border:none;
border-radius:30px;
background:#00c6a2;
color:white;
font-weight:bold;
}

/* GIFTS */

.gift-panel{
position:fixed;
bottom:80px;
left:0;
right:0;
background:#181824;
padding:20px;
display:none;
border-top-left-radius:25px;
border-top-right-radius:25px;
}

.gifts{
display:flex;
justify-content:space-around;
}

.gift{
text-align:center;
cursor:pointer;
}

.gift i{
font-size:35px;
margin-bottom:5px;
}

.gift-animation{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:90px;
display:none;
animation:giftFly 2s forwards;
}

@keyframes giftFly{
0%{
opacity:0;
transform:translate(-50%,50%) scale(0.5);
}
50%{
opacity:1;
}
100%{
opacity:0;
transform:translate(-50%,-200%) scale(1.8);
}
}

/* LEADERBOARD */

.leaderboard{
padding:15px;
}

.rank-card{
background:#181824;
margin-bottom:12px;
padding:15px;
border-radius:20px;
display:flex;
justify-content:space-between;
}

/* PROFILE */

.profile{
padding:20px;
text-align:center;
}

.profile img{
width:100px;
height:100px;
border-radius:50%;
margin-bottom:15px;
}

/* NAVIGATION */

.bottom-nav{
height:70px;
background:#11111a;
display:flex;
justify-content:space-around;
align-items:center;
position:fixed;
bottom:0;
left:0;
right:0;
border-top:1px solid rgba(255,255,255,0.08);
}

.nav-item{
text-align:center;
font-size:12px;
color:#999;
}

.nav-item.active{
color:#00d9a5;
}

.nav-item i{
display:block;
font-size:22px;
margin-bottom:5px;
}

.create-btn{
width:60px;
height:60px;
background:linear-gradient(135deg,#00c6a2,#ff4da6);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin-top:-30px;
font-size:25px;
color:white;
}

/* RESPONSIVE */

@media(max-width:480px){

.mic-grid{
grid-template-columns:repeat(3,1fr);
}

}

</style>
</head>

<body>

<div class="app">

<!-- TOP BAR -->

<div class="top-bar">
<div>G-Matrix</div>

<div class="wallet">
<span><i class="fa-solid fa-coins"></i> 15000</span>
<span><i class="fa-solid fa-gem"></i> 320</span>
</div>
</div>

<!-- HOME PAGE -->

<div class="page active" id="homePage">

<div class="live-card">
<div class="live-header">
<div class="live-title">Music Lovers Room</div>
<div class="live-users">
<i class="fa-solid fa-users"></i> 1.2K
</div>
</div>
</div>

<div class="live-room">

<div class="host-seat">

<div class="host-circle">
<div class="voice-ring"></div>

<img src="https://i.pravatar.cc/200"/>
</div>

</div>

<div class="mic-grid">

<div class="mic-seat">
<div class="seat-number">1</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">2</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">3</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">4</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">5</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">6</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">7</div>
<i class="fa-solid fa-microphone"></i>
</div>

<div class="mic-seat">
<div class="seat-number">8</div>
<i class="fa-solid fa-microphone"></i>
</div>

</div>

<div class="audience">
<div class="audience-user">Ahmed joined</div>
<div class="audience-user">Sara listening</div>
<div class="audience-user">Mike joined</div>
<div class="audience-user">John listening</div>
</div>

</div>

</div>

<!-- MESSAGES PAGE -->

<div class="page" id="messagePage">

<div class="chat-container">

<div class="chat-box" id="chatBox">

<div class="message received">
<div class="bubble">
Hello 👋
</div>
</div>

</div>

<div class="chat-input">

<input type="text" id="messageInput"
placeholder="Type message...">

<button onclick="sendMessage()">
<i class="fa-solid fa-paper-plane"></i>
</button>

</div>

<button class="record-btn"
id="recordBtn">
🎤 Hold To Talk
</button>

</div>

</div>

<!-- LEADERBOARD -->

<div class="page" id="discoverPage">

<div class="leaderboard">

<div class="rank-card">
<div>#1 Ali</div>
<div>250K Coins</div>
</div>

<div class="rank-card">
<div>#2 Mona</div>
<div>210K Coins</div>
</div>

<div class="rank-card">
<div>#3 Kevin</div>
<div>180K Coins</div>
</div>

</div>

</div>

<!-- PROFILE -->

<div class="page" id="profilePage">

<div class="profile">

<img src="https://i.pravatar.cc/300"/>

<h2>Seid</h2>

<p>@gmatrix_user</p>

<br>

<h3>Followers: 12.4K</h3>
<h3>Following: 650</h3>

</div>

</div>

<!-- GIFT PANEL -->

<div class="gift-panel" id="giftPanel">

<div class="gifts">

<div class="gift" onclick="sendGift('🌹')">

</div>

<p>Crown</p>
</div>

<p>Supercar</p>

</div>

<div class="gift-animation"
id="giftAnimation"></div>

<!-- NAVIGATION -->

<div class="bottom-nav">

<div class="nav-item active"
onclick="showPage('homePage',this)">
<i class="fa-solid fa-house"></i>
Home
</div>

<div class="nav-item"
onclick="showPage('discoverPage',this)">
<i class="fa-solid fa-compass"></i>
Discover
</div>

onclick="toggleGiftPanel()">
+
</div>

<div class="nav-item"
onclick="showPage('messagePage',this)">
<i class="fa-solid fa-message"></i>
Messages
</div>

<div class="nav-item"
onclick="showPage('profilePage',this)">
<i class="fa-solid fa-user"></i>
Profile
</div>

<script>

/* PAGE NAVIGATION */

function showPage(pageId, el){

document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document.getElementById(pageId)
.classList.add('active');

document.querySelectorAll('.nav-item')
.forEach(n=>n.classList.remove('active'));

el.classList.add('active');

}

/* CHAT */

function sendMessage(){

const input =
document.getElementById('messageInput');

if(input.value.trim()==='') return;

const box =
document.getElementById('chatBox');

const msg =
document.createElement('div');

msg.className='message sent';

msg.innerHTML=
`<div class="bubble">${input.value}</div>`;

box.appendChild(msg);

input.value='';

box.scrollTop=box.scrollHeight;

}

/* VOICE RECORD */

let mediaRecorder;
let audioChunks=[];

const recordBtn =
document.getElementById('recordBtn');

recordBtn.addEventListener('mousedown',
startRecording);

recordBtn.addEventListener('mouseup',
stopRecording);

async function startRecording(){

const stream =
await navigator.mediaDevices
.getUserMedia({audio:true});

mediaRecorder =
new MediaRecorder(stream);

mediaRecorder.start();

audioChunks=[];

mediaRecorder.ondataavailable =
e=>{
audioChunks.push(e.data);
};

recordBtn.innerText='Recording...';

}

function stopRecording(){

mediaRecorder.stop();

mediaRecorder.onstop=()=>{

const audioBlob =
new Blob(audioChunks);

const audioURL =
URL.createObjectURL(audioBlob);

const box =
document.getElementById('chatBox');

const msg =
document.createElement('div');

msg.className='message sent';

msg.innerHTML=
`
<div class="bubble">
<audio controls src="${audioURL}"></audio>
</div>
`;

box.appendChild(msg);

box.scrollTop=box.scrollHeight;

};

recordBtn.innerText='🎤 Hold To Talk';

}

/* GIFTS */

function toggleGiftPanel(){

const panel =
document.getElementById('giftPanel');

panel.style.display =
panel.style.display==='block'
?'none':'block';

}

function sendGift(gift){

const anim =
document.getElementById('giftAnimation');

anim.innerText=gift;

anim.style.display='block';

setTimeout(()=>{
anim.style.display='none';
},2000);

}

/* AGORA RTC */

const APP_ID = "srv-d7tdnn77f7vs739rntj0";

const TOKEN = null;

const CHANNEL = "gmatrix-room";

const client =
AgoraRTC.createClient({mode:"rtc",
codec:"vp8"});

async function joinRoom(){

await client.join(
APP_ID,
CHANNEL,
TOKEN,
null
);

const localTrack =
await AgoraRTC
.createMicrophoneAudioTrack();

await client.publish([localTrack]);

console.log("Joined Room");

client.on("user-published",
async(user,mediaType)=>{

await client.subscribe(user,
mediaType);

if(mediaType==="audio"){

user.audioTrack.play();

}

});

}

joinRoom();

</script>

</body>
</html>
