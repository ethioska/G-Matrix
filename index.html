<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Matrix | Professional Hala Live</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.11.0.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --hala: #22e1d1; --bg: #f8f9fa; --dark: #333; --pink: #ff4dff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; }
        .page { display: none; height: 100vh; flex-direction: column; }
        .active { display: flex; }

        /* Splash Screen */
        #splash { background: var(--hala); display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; font-weight: bold; }

        /* Header Styles */
        .header { background: var(--hala); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .coin-box { background: rgba(0,0,0,0.15); padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }

        /* Profile Section */
        .profile-bar { padding: 15px; background: white; margin-bottom: 5px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; }
        .avatar-circle { width: 50px; height: 50px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; overflow: hidden; }

        /* Room Cards */
        .room-container { flex-grow: 1; padding: 15px; overflow-y: auto; background: #f0f2f5; }
        .room-card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.03); border: 1px solid #eee; }
        .room-title { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
        .room-meta { font-size: 12px; color: #888; }

        /* Live Room Page */
        #room-page { background: linear-gradient(180deg, var(--hala) 0%, #ffffff 50%); }
        .room-header { padding: 15px; color: white; display: flex; align-items: center; gap: 15px; }
        .seats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; margin-top: 10px; }
        .seat { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #555; font-size: 12px; }
        .seat-circle { width: 55px; height: 55px; background: rgba(255,255,255,0.4); border-radius: 50%; border: 2px dashed rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; position: relative; }
        .host-seat { grid-column: span 4; margin-bottom: 10px; }
        .host-circle { width: 80px; height: 80px; background: white; border: 3px solid var(--pink); box-shadow: 0 0 15px rgba(255,77,255,0.4); }

        /* Chat System */
        .chat-display { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 80px; }
        .chat-bubble { padding: 8px 15px; border-radius: 15px; font-size: 14px; max-width: 85%; animation: slideUp 0.3s ease; }
        .my-chat { background: #e3fcf9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .other-chat { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }

        /* Interaction Bar */
        .action-bar { position: fixed; bottom: 0; width: 100%; background: white; padding: 12px 15px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #eee; }
        .chat-input { flex-grow: 1; background: #f1f3f4; border: none; padding: 12px; border-radius: 25px; outline: none; }
        .mic-trigger { width: 45px; height: 45px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #777; transition: 0.3s; cursor: pointer; }
        .mic-active { background: var(--hala); color: white; box-shadow: 0 0 10px var(--hala); animation: pulsate 1.5s infinite; }

        @keyframes pulsate { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash" class="page active">G-MATRIX</div>

    <!-- Home Page -->
    <div id="home-page" class="page">
        <header class="header">
            <div style="font-size: 20px; font-weight: 900;">Hala Live</div>
            <div class="coin-box"><i class="fas fa-coins" style="color:gold"></i> 1,500</div>
        </header>
        
        <div class="profile-bar">
            <div class="avatar-circle" id="user-avatar" style="background: #ff5e62;">U</div>
            <div>
                <div id="display-name" style="font-weight: bold;">User_7721</div>
                <div style="font-size: 11px; color: #888;">ID: 998213 | Lv. 1</div>
            </div>
        </div>

        <div class="room-container">
            <div class="room-card" onclick="startApp('የኢትዮጵያ ምርጦች 🇪🇹')">
                <div>
                    <div class="room-title">የኢትዮጵያ ምርጦች 🇪🇹</div>
                    <div class="room-meta"><i class="fas fa-users"></i> 1,240 online</div>
                </div>
                <i class="fas fa-headset" style="font-size: 24px; color: var(--hala)"></i>
            </div>
            
            <div class="room-card" onclick="startApp('G-Matrix VIP Room')">
                <div>
                    <div class="room-title">G-Matrix VIP Room 💎</div>
                    <div class="room-meta"><i class="fas fa-users"></i> 42 online</div>
                </div>
                <i class="fas fa-shield-halved" style="font-size: 24px; color: #ff9800"></i>
            </div>
        </div>
    </div>

    <!-- Live Room Page -->
    <div id="room-page" class="page">
        <div class="room-header">
            <i class="fas fa-chevron-left" onclick="leaveRoom()"></i>
            <span id="active-room-name" style="font-weight: bold;">...</span>
        </div>

        <div class="seats-grid">
            <div class="seat host-seat">
                <div class="seat-circle host-circle"><i class="fas fa-crown" style="font-size: 30px; color: var(--pink)"></i></div>
                <b>Admin</b>
            </div>
            <div class="seat"><div class="seat-circle">1</div></div>
            <div class="seat"><div class="seat-circle">2</div></div>
            <div class="seat"><div class="seat-circle">3</div></div>
            <div class="seat"><div class="seat-circle">4</div></div>
        </div>

        <div class="chat-display" id="chat-box"></div>

        <div class="action-bar">
            <div class="mic-trigger" id="main-mic" onclick="toggleAudio()">
                <i class="fas fa-microphone-slash" id="mic-icon"></i>
            </div>
            <input type="text" class="chat-input" id="chat-msg" placeholder="መልእክት ይጻፉ..." onkeypress="handleEnter(event)">
            <i class="fas fa-gift" style="color: #ff9800; font-size: 25px;"></i>
        </div>
    </div>

    <script>
        const APP_ID = "699e23ee48c64b02b5471b212a486e29";
        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localTracks = { audio: null };
        let micOn = false;

        // መጀመሪያ Splash screen እንዲታይ
        setTimeout(() => { showPage('home-page'); }, 2000);

        async function startApp(roomName) {
            document.getElementById('active-room-name').innerText = roomName;
            showPage('room-page');
            
            try {
                // መጀመሪያ ማይክሮፎን ፈቃድ መጠየቅ
                localTracks.audio = await AgoraRTC.createMicrophoneAudioTrack();
                await localTracks.audio.setEnabled(false); // ሲጀመር ዝም እንዲል
                
                await client.join(APP_ID, "main-channel", null, null);
                await client.publish([localTracks.audio]);
                
                addChat("System", "እንኳን መጡ! አሁን ድምፅ ለመልቀቅ ማይኩን ይንኩ።", "gray");
            } catch (err) {
                console.error(err);
                alert("ማይክሮፎን አልተፈቀደም! እባክዎ በ Chrome Setting ውስጥ 'Allow' ማለታችሁን ያረጋግጡ።");
            }
        }

        async function toggleAudio() {
            if (!localTracks.audio) return;
            
            if (!micOn) {
                await localTracks.audio.setEnabled(true);
                document.getElementById('main-mic').classList.add('mic-active');
                document.getElementById('mic-icon').className = "fas fa-microphone";
                micOn = true;
            } else {
                await localTracks.audio.setEnabled(false);
                document.getElementById('main-mic').classList.remove('mic-active');
                document.getElementById('mic-icon').className = "fas fa-microphone-slash";
                micOn = false;
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && e.target.value.trim() !== "") {
                addChat("እኔ", e.target.value, "my");
                e.target.value = "";
            }
        }

        function addChat(user, msg, type) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `chat-bubble ${type === 'my' ? 'my-chat' : 'other-chat'}`;
            div.innerHTML = `<b>${user}:</b> ${msg}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function leaveRoom() {
            if (localTracks.audio) {
                localTracks.audio.stop();
                localTracks.audio.close();
            }
            await client.leave();
            showPage('home-page');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // ሌሎች ሲናገሩ ለመስማት
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            if (mediaType === "audio") user.audioTrack.play();
        });
    </script>
</body>
</html>
