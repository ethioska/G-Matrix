<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>G-Matrix</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#07121f;
color:white;
}

.top{
padding:18px;
font-size:32px;
font-weight:bold;
text-align:center;
background:linear-gradient(90deg,#08d9c4,#ff2d96);
}

.page{
padding:20px;
}

.card{
background:#112033;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:18px;
margin-bottom:15px;
border:none;
border-radius:15px;
background:#1d3147;
color:white;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
}

.hostBtn{
background:#00c9a7;
}

.joinBtn{
background:#ff2d96;
}

.livePage{
display:none;
}

.roomHeader{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
}

.counter{
display:flex;
gap:15px;
font-size:18px;
}

.hostCard{
background:#102235;
margin:15px;
padding:25px;
border-radius:25px;
text-align:center;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
background:#ff9800;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
font-weight:bold;
margin:auto;
position:relative;
}

.pulse{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 #00ff9d;}
100%{box-shadow:0 0 0 20px transparent;}
}

.speakers{
padding:15px;
}

.speaker{
background:#12273d;
padding:18px;
border-radius:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.controls{
display:flex;
gap:10px;
}

.small{
padding:10px 14px;
border:none;
border-radius:10px;
font-size:14px;
}

.mute{
background:orange;
}

.kick{
background:red;
}

.applyBtn{
position:fixed;
bottom:90px;
left:20px;
right:20px;
background:#00c9a7;
}

.chat{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
padding:10px;
background:#07121f;
box-sizing:border-box;
}

.chat input{
margin:0;
}

.send{
width:80px;
margin-left:10px;
background:#ff2d96;
}

</style>
</head>
<body>

<div class="top">G-Matrix</div>

<div class="page" id="homePage">

<div class="card">
<h2>Host Room</h2>
<input id="hostName" placeholder="Your Name">
<button class="hostBtn" onclick="hostRoom()">
Host Live
</button>
</div>

<div class="card">
<h2>Join Room</h2>
<input id="joinName" placeholder="Your Name">
<input id="joinHost" placeholder="Host Name">
<input id="joinRoomId" placeholder="Room ID">
<button class="joinBtn" onclick="joinRoom()">
Join Live
</button>
</div>

</div>

<div class="livePage" id="livePage">

<div class="roomHeader">
<div id="roomInfo"></div>
<div class="counter">
<div>👥 <span id="listenerCount">0</span></div>
<div>🎤 <span id="speakerCount">0</span></div>
</div>
</div>

<div class="hostCard">
<div class="avatar" id="hostAvatar">H</div>
<h2 id="hostLabel"></h2>
</div>

<div class="speakers" id="speakerList"></div>

<button class="applyBtn" id="applyBtn" onclick="applyMic()">
Apply Mic
</button>

</div>

<div class="chat">
<input id="chatInput" placeholder="Message">
<button class="send" onclick="sendMessage()">
<i class="fa fa-paper-plane"></i>
</button>
</div>

<script>

const socket = io();

const APP_ID = "08f3860e6a9f4775b0b5acefe96b2b51";

const client = AgoraRTC.createClient({
mode:"rtc",
codec:"vp8"
});

let localTrack;
let currentRoom="";
let myName="";
let isHost=false;

async function hostRoom(){

const name=document.getElementById("hostName").value;

if(!name) return alert("Enter Name");

myName=name;
isHost=true;

socket.emit("host-room",{name});

}

socket.on("room-created", async data=>{

currentRoom=data.roomId;

showLive(data.hostName,data.roomId);

await joinAgora(currentRoom,true);

});

async function joinRoom(){

const name=document.getElementById("joinName").value;
const hostName=document.getElementById("joinHost").value;
const roomId=document.getElementById("joinRoomId").value;

if(!name || !hostName || !roomId){
alert("Fill All");
return;
}

myName=name;

socket.emit("join-room",{
roomId,
name,
hostName
});

}

socket.on("join-success", async data=>{

currentRoom=data.roomId;

showLive(data.hostName,data.roomId);

await joinAgora(currentRoom,false);

});

socket.on("join-error",msg=>{
alert(msg);
});

function showLive(host,id){

homePage.style.display="none";
livePage.style.display="block";

roomInfo.innerHTML="Room ID : "+id;
hostLabel.innerHTML=host;
hostAvatar.innerHTML=host.charAt(0).toUpperCase();

}

async function joinAgora(channel,publish){

await client.join(APP_ID,channel,null,null);

if(publish){

localTrack=await AgoraRTC.createMicrophoneAudioTrack();

await client.publish([localTrack]);

}

client.on("user-published", async(user,mediaType)=>{

await client.subscribe(user,mediaType);

if(mediaType==="audio"){
user.audioTrack.play();
}

});

}

function applyMic(){

socket.emit("apply-mic",{
roomId:currentRoom,
name:myName
});

alert("Mic Request Sent");

}

socket.on("mic-request", data=>{

if(!isHost) return;

const ok=confirm(data.name+" wants mic");

if(ok){

socket.emit("approve-speaker",{
roomId:currentRoom,
user:{
name:data.name,
socketId:data.socketId
}
});

}

});

socket.on("speaker-approved", users=>{

speakerCount.innerHTML=users.length;

speakerList.innerHTML="";

users.forEach(user=>{

speakerList.innerHTML+=`
<div class="speaker">
<div>
<h3>${user.name}</h3>
</div>
<div class="controls">
<button class="small mute">Mute</button>
<button class="small kick">Kick</button>
</div>
</div>
`;

});

});

socket.on("listeners-update",data=>{
listenerCount.innerHTML=data.count;
});

function sendMessage(){

const message=chatInput.value;

socket.emit("chat-message",{
roomId:currentRoom,
name:myName,
message
});

chatInput.value="";

}

socket.on("chat-message",data=>{
alert(data.name+": "+data.message);
});

socket.on("room-ended",()=>{
alert("Host Ended Live");
location.reload();
});

</script>
</body>
</html>
