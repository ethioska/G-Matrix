<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Matrix Gaming</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">G-MATRIX</div>
        <div class="user-info">
            <span id="balance">Br 20.00</span>
            <button onclick="showDeposit()" class="deposit-btn">Deposit</button>
        </div>
    </header>

    <!-- ጨዋታው የሚከፈትበት ቦታ (Iframe Section) -->
    <section id="game-display-section" style="display:none; padding: 20px; text-align: center;">
        <button onclick="closeGame()" style="background:red; color:white; border:none; padding:10px; margin-bottom:10px; border-radius:5px; cursor:pointer;">ጨዋታውን ዝጋ</button>
        <div id="iframe-wrapper">
            <!-- እዚህ ውስጥ ጨዋታው በIframe ይገባል -->
        </div>
    </section>

    <main class="games-grid" id="main-games-list">
        <div class="game-card">
            <img src="https://smartsoftgaming.com/Images/Games/JetX.png" alt="JetX">
            <h3>JetX</h3>
            <button onclick="playGame('jetx')" class="play-btn">አሁን ተጫወት</button>
        </div>
        <div class="game-card">
            <img src="https://smartsoftgaming.com/Images/Games/Balloon.png" alt="Balloon">
            <h3>Balloon</h3>
            <button onclick="playGame('balloon')" class="play-btn">አሁን ተጫወት</button>
        </div>
    </main>

    <div id="depositModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <i class="fas fa-tools" style="font-size: 50px; color: #ff0055;"></i>
            <h2>በቅርብ ቀን!</h2>
            <p>የተቀማጭ ስርዓቱ በግንባታ ላይ ነው።</p>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
