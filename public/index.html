<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Matrix | Hala Style</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- 1. HOME PAGE (የተደረደሩ ሩሞች) -->
    <div id="home-page" class="page active">
        <header class="hala-header">
            <div class="tabs">
                <span>Follow</span>
                <span class="active-tab">Hot</span>
            </div>
            <div class="user-coins"><i class="fas fa-coins"></i> <span id="balance">500</span></div>
        </header>

        <div class="search-bar"><i class="fas fa-search"></i> Search Room ID...</div>

        <div class="room-list">
            <div class="room-card" onclick="goToRoom('የአቢሲኒያ ፓርቲ', 'Host: Abdi')">
                <div class="room-info">
                    <h3>የአቢሲኒያ ፓርቲ 🇪🇹</h3>
                    <p>Host: Abdi | <i class="fas fa-users"></i> 2.5k</p>
                </div>
            </div>
            <div class="room-card" onclick="goToRoom('Hala Music', 'Host: Sara')">
                <div class="room-info">
                    <h3>Hala Music 🎵</h3>
                    <p>Host: Sara | <i class="fas fa-users"></i> 1.2k</p>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <i class="fas fa-home active-icon"></i>
            <div class="mic-btn-main" onclick="goToRoom('My Room', 'Owner')"><i class="fas fa-microphone"></i></div>
            <i class="fas fa-user"></i>
        </nav>
    </div>

    <!-- 2. VOICE ROOM PAGE (የድምጽ ሩም) -->
    <div id="voice-room" class="page">
        <div class="room-top">
            <i class="fas fa-chevron-left" onclick="goHome()"></i>
            <h2 id="active-room-name">Room Name</h2>
            <div class="task-icon" onclick="toggleTask()">🎁</div>
        </div>

        <div class="voice-grid">
            <div class="seat-circle active-speaker"><i class="fas fa-user-tie"></i></div>
            <div class="seat-circle"><i class="fas fa-plus"></i></div>
            <div class="seat-circle"><i class="fas fa-plus"></i></div>
            <div class="seat-circle"><i class="fas fa-plus"></i></div>
        </div>

        <div class="chat-area" id="room-chat"></div>

        <div class="room-controls">
            <i class="fas fa-microphone-slash"></i>
            <input type="text" placeholder="መልእክት..." id="chat-input" onkeypress="checkEnter(event)">
            <i class="fas fa-gift gift-icon" onclick="openGifts()"></i>
        </div>

        <!-- Task Sidebar (ታስክ) -->
        <div id="task-sidebar" class="sidebar">
            <h4>Daily Tasks</h4>
            <div class="task-item">
                <p>30 Min Stream</p>
                <button onclick="claim(10)">Claim 10</button>
            </div>
            <div class="task-item">
                <p>Room Bombing (Top 3)</p>
                <small>Every 3 Hours</small>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
